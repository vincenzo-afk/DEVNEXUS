<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevNexus — Product Walkthrough</title>
    <style>
      :root { color-scheme: dark; --bg: #080d1c; --panel: #111930; --line: #2c3a5e; --text: #ebf1ff; --muted: #91a2c6; --accent: #48d7ff; --violet: #9168ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 80% 10%, #1c2a53 0, transparent 42%), radial-gradient(circle at 10% 90%, #12274a 0, transparent 38%), var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(1120px, 100%); }
      .eyebrow { color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.05; }
      p { margin: 0 0 24px; color: var(--muted); }
      .player { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(17, 25, 48, .82); box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
      video { display: block; width: 100%; height: auto; background: #080d1c; }
      footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 18px 20px; color: var(--muted); font-size: .88rem; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">DevNexus / Product walkthrough</div>
      <h1>Build with context.</h1>
      <p>Repository context, AI momentum, smart TODOs, notes, and hackathon planning in one developer workspace.</p>
      <section class="player" aria-label="DevNexus product walkthrough video">
        <video controls playsinline preload="metadata" poster="./devnexus-demo-poster.jpg">
          <source src="./devnexus-demo.mp4" type="video/mp4" />
          Your browser does not support embedded video. <a href="./devnexus-demo.mp4">Play or download the walkthrough</a>.
        </video>
        <footer>
          <span>DevNexus · vincenzo-afk/DEVNEXUS</span>
          <a href="https://github.com/vincenzo-afk/DEVNEXUS">View the repository</a>
        </footer>
      </section>
    </main>
  </body>
</html>
